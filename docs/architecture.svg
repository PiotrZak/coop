<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Coop DDD architecture</title>
  <desc id="desc">Presentation and adapters depend on application, which depends on domain. Identity is AuthN infrastructure. Tests cover all layers.</desc>
  <rect width="720" height="420" fill="#f7f7f5"/>
  <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#1a1a1a">Coop - DDD layers</text>
  <text x="24" y="58" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#555">dependencies point inward only</text>

  <rect x="40" y="80" width="640" height="70" rx="8" fill="#e8f1ff" stroke="#3b6ea5" stroke-width="1.5"/>
  <text x="56" y="108" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1a3a5c">Presentation / adapters</text>
  <text x="56" y="130" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#234">coop-a2a - gateway / negotiation / supplier / demo / JSON-RPC / Axum</text>

  <rect x="40" y="168" width="300" height="70" rx="8" fill="#fff3e6" stroke="#b87a2a" stroke-width="1.5"/>
  <text x="56" y="196" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#5c3a10">Identity infra</text>
  <text x="56" y="218" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#234">coop-identity - Bearer AuthN</text>

  <rect x="380" y="168" width="300" height="70" rx="8" fill="#e9f7ef" stroke="#2f7d4a" stroke-width="1.5"/>
  <text x="396" y="196" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e4d2e">Application</text>
  <text x="396" y="218" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#234">negotiate / supplier / SkillRouter</text>

  <rect x="40" y="256" width="640" height="78" rx="8" fill="#f3eefc" stroke="#6b4ea2" stroke-width="1.5"/>
  <text x="56" y="284" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#3a2a5c">Domain (coop-domain)</text>
  <text x="56" y="306" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#234">RBAC: Role / RbacLevel / Scope / Principal::authorize</text>
  <text x="56" y="324" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#234">A2A: Task / Message / NegotiateParams / SupplierLookupParams</text>

  <rect x="40" y="352" width="640" height="48" rx="8" fill="#f0f0f0" stroke="#666" stroke-width="1.5"/>
  <text x="56" y="382" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#333">Test - coop-tests (identity / application / proxy)</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#555"/>
    </marker>
  </defs>
  <line x1="360" y1="150" x2="190" y2="168" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="360" y1="150" x2="530" y2="168" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="190" y1="238" x2="280" y2="256" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="530" y1="238" x2="440" y2="256" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
