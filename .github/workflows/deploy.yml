name: "[PROD] Coop Cloud Run"

# Mirrors Lindle's Cloud Run deploy shape, but secrets stay in THIS repo's
# GitHub Actions secrets — do not copy Lindle secret values here.
#
# Required repo secrets (create empty/own values in GitHub → Settings → Secrets):
#   GCP_SA_KEY — deployer service account JSON (your GCP project)

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - ".github/workflows/deploy.yml"
      - "Terraform/**"
  workflow_dispatch:

env:
  # Override in repo Variables if you use a different GCP project.
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'YOUR_GCP_PROJECT_ID' }}
  GAR_LOCATION: ${{ vars.GAR_LOCATION || 'europe-central2' }}
  SERVICE: coop-a2a
  REGION: ${{ vars.GCP_REGION || 'europe-central2' }}
  ENVIRONMENT: prod

jobs:
  deploy:
    name: Build & deploy
    # Set repo Variable GCP_PROJECT_ID when ready; secret GCP_SA_KEY must exist.
    if: ${{ vars.GCP_PROJECT_ID != '' }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Ensure Artifact Registry repo
        run: |
          gcloud artifacts repositories describe "${{ env.SERVICE }}" \
            --location="${{ env.GAR_LOCATION }}" \
            --project="${{ env.PROJECT_ID }}" >/dev/null 2>&1 \
          || gcloud artifacts repositories create "${{ env.SERVICE }}" \
            --repository-format=docker \
            --location="${{ env.GAR_LOCATION }}" \
            --project="${{ env.PROJECT_ID }}" \
            --description="Coop A2A edge"

      - name: Build and push
        run: |
          gcloud auth configure-docker "${{ env.GAR_LOCATION }}-docker.pkg.dev" --quiet
          IMAGE="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.SERVICE }}/${{ env.ENVIRONMENT }}-${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}
          revision_traffic: LATEST=100
          flags: "--allow-unauthenticated --min-instances=0 --cpu=1 --memory=512Mi --port=8080 --timeout=60"
          env_vars: |
            RUST_LOG=info

      - name: Show URL
        run: gcloud run services describe ${{ env.SERVICE }} --region ${{ env.REGION }} --format='value(status.url)'
